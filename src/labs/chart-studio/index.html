<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" href="../../assets/icons/intelex-logo.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Chart Studio của Intelex Labs: kéo thả và thiết kế biểu đồ trình bày ngay trên trình duyệt.">
    <title>Chart Studio — Intelex Labs</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/workspace.css">
  </head>
  <body data-page="workspace" data-lab="chart-studio">
    <header class="editor-topbar chart-studio-topbar">
      <a class="editor-brand" href="../index.html" aria-label="Quay lại Intelex Labs"><img class="editor-brand__icon" src="../../assets/icons/intelex-logo.ico" alt=""><strong>Intelex Labs</strong></a>
      <div class="chart-studio-title">
        <span class="eyebrow">Data &amp; BI</span>
        <strong data-lab-title>Chart Studio</strong>
      </div>
      <div class="editor-status">
        <span data-stage-status>Sẵn sàng</span>
        <button class="icon-button" type="button" data-reset-lab>Đặt lại</button>
      </div>
    </header>

    <main class="chart-studio-page">
      <span data-lab-switcher hidden></span>
      <div class="chart-studio-page-intro">
        <div>
          <p class="eyebrow" data-stage-label>Biểu đồ trình bày</p>
          <h1>Thiết kế không gian trực quan hóa</h1>
          <p data-lab-summary>Kéo loại biểu đồ vào canvas, chọn từng chart để chỉnh dữ liệu và phong cách hiển thị.</p>
        </div>
        <a class="button button--secondary" href="../index.html">Tất cả Labs</a>
      </div>
      <section class="chart-studio-workspace" data-playground-workspace aria-label="Chart Studio workspace"></section>
    </main>

    <script src="../../assets/js/labs-data.js"></script>
    <script src="../../assets/js/lab-playground.js"></script>
  </body>
</html>
